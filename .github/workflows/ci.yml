name: Testes
on:
  push: { branches: [main] }
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: plataforma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - name: Tipos (TypeScript) — informativo, não bloqueia
        continue-on-error: true
        run: npm run typecheck
      - name: Testes das regras (TypeScript)
        run: npm test
      - name: Banco de teste + testes SQL
        run: |
          createdb teste
          export PGDATABASE=teste
          psql -v ON_ERROR_STOP=1 -q -f tests/sql/_stubs_supabase.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/001_schema.sql
          psql -v ON_ERROR_STOP=1 -q -f tests/sql/025_testes.sql
